<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ren'Py to PS3</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <div class="row">
        <label>Task:</label>
        <select id="task"></select>
      </div>

      <div class="row">
        <label id="input-label">Game folder:</label>
        <div class="field">
          <input id="input-path" type="text" />
          <span id="input-hint" class="hint"></span>
        </div>
        <button id="browse-input" type="button">Browse...</button>
      </div>

      <div class="row" id="output-row">
        <label>Output:</label>
        <div class="field">
          <input id="output-path" type="text" />
          <span id="output-hint" class="hint"></span>
        </div>
        <button id="browse-output" type="button">Browse...</button>
      </div>

      <div class="row" id="pack-row">
        <label title="Images larger than this (longest edge, in pixels) are shrunk to fit">Max image size:</label>
        <div class="pack-opts">
          <input id="max-edge" type="text" value="1920" class="num" />
          <span class="dim">px</span>
          <label class="check" title="Some fonts can't show curly quotes or the single-character ellipsis; this swaps them for plain &quot; and ...">
            <input id="ascii-text" type="checkbox" /> Use plain quotes/dots
          </label>
          <label class="check" title="Re-encode every asset instead of reusing results from earlier packs">
            <input id="no-cache" type="checkbox" /> No cache
          </label>
          <label class="check" title="Wipe the asset cache first, then pack and rebuild it">
            <input id="clear-cache" type="checkbox" /> Clear cache
          </label>
        </div>
      </div>

      <div class="row hidden" id="ast-row">
        <label>Label (optional):</label>
        <input id="ast-label" type="text" class="short" title="Also report where this script label sits in the tree" />
      </div>

      <textarea id="log" readonly></textarea>

      <div class="row footer">
        <button id="run" type="button">Run</button>
        <button id="clear" type="button">Clear Log</button>
        <span id="status" class="dim"></span>
      </div>
    </div>
  </body>
</html>
