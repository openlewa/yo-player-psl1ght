<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ren'Py to PS3</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="row">
        <label>Task:</label>
        <select id="task"></select>
      </div>

      <div class="row">
        <label id="input-label">Game folder:</label>
        <div class="field">
          <input id="input-path" type="text" placeholder="ren'py 'game' folder" />
        </div>
        <button id="browse-input" type="button">Browse...</button>
      </div>

      <div class="row" id="output-row">
        <label>Output:</label>
        <div class="field">
          <input id="output-path" type="text" placeholder=".rpk file to output as" />
        </div>
        <button id="browse-output" type="button">Browse...</button>
      </div>

      <div class="row" id="pack-row">
        <label title="Images larger than this (longest edge, in pixels) are shrunk to fit">Max image size:</label>
        <div class="pack-opts">
          <input id="max-edge" type="text" value="1920" class="num" />
          <span class="dim">px</span>
          <label class="check">
            <input id="ascii-text" type="checkbox" /> Use plain quotes/dots
          </label>
          <label class="check">
            <input id="no-cache" type="checkbox" /> No cache
          </label>
          <label class="check">
            <input id="clear-cache" type="checkbox" /> Clear cache
          </label>
        </div>
      </div>

      <div class="row hidden" id="ast-row">
        <label>Label (optional):</label>
        <input id="ast-label" type="text" class="short" />
      </div>

      <textarea id="log" readonly></textarea>

      <div class="row footer">
        <button id="run" type="button">Run</button>
        <button id="clear" type="button">Clear Log</button>
        <span id="status" class="dim"></span>
      </div>
    </div>

    <div id="picker" class="picker hidden">
      <div class="picker-box">
        <div class="picker-help">Open a folder, then click Select this folder. One click opens a folder.</div>
        <div class="picker-path" id="picker-path"></div>
        <div class="picker-list" id="picker-list"></div>
        <div class="picker-actions">
          <button id="picker-up" type="button">Up</button>
          <button id="picker-use" type="button">Select this folder</button>
          <input id="picker-name" type="text" class="picker-name" />
          <button id="picker-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
